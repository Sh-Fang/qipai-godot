[project]
name = "douzero-core"
version = "0.1.0"
description = "DouZero 斗地主算法核心：规则、编码、ONNX 推理与对局流程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
]

[project.scripts]
douzero-core = "douzero_core.server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
